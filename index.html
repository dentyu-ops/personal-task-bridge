  <h1>Personal Task Bridge</h1>
  <p>Personal Task Bridgeは、個人のGoogle Tasksを
     ChatGPTから管理するための非営利の個人用ツールです。</p>

  <h2>主な機能</h2>
  <ul>
    <li>Google Tasksのタスクリストとタスクの取得</li>
    <li>タスクの新規登録</li>
    <li>既存タスクの更新と完了操作</li>
  </ul>

  <h2>Googleアカウントへのアクセス</h2>
  <p>本人の許可を受けてGoogle Tasksにアクセスします。
     タスクの読み取りと変更に必要な権限を使用します。</p>

  <h2>利用対象</h2>
  <p>開発者本人による個人利用を想定しています。
     一般向けのサービスとして提供していません。</p>
